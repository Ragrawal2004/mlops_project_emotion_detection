name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.10"
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: rounak_mlflow

jobs:
  # --------------------------------------------------------------------
  # 1. Lint, run the DVC pipeline, and test
  # --------------------------------------------------------------------
  project-testing:
    name: Test & Train
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Lint (flake8)
        run: flake8 src tests flask_app scripts

      - name: Run DVC pipeline
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: dvc repro

      - name: Upload trained model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            models/model.pkl
            models/vectorizer.pkl
          retention-days: 1
          if-no-files-found: error

      - name: Run model tests
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: python -m unittest tests/test_model.py -v

      - name: Promote model to Production
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: python scripts/promote_model.py

      - name: Run Flask app tests
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: python -m unittest tests/test_flask_app.py -v

  # --------------------------------------------------------------------
  # 2. Build, smoke-test, and push the Docker image to ECR
  # --------------------------------------------------------------------
  docker-build:
    name: Build & Push to ECR
    needs: project-testing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_uri: ${{ steps.image-tag.outputs.uri }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download trained model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: models

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: image-tag
        run: |
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          echo "uri=${REGISTRY}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # Building explicitly for linux/amd64 — this is required because
      # local dev builds on Apple Silicon (arm64) produce images that
      # crash on amd64 EC2 instances with "exec format error".
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run -d --name smoke-test \
            -p 80:80 \
            -e DAGSHUB_PAT="${DAGSHUB_PAT}" \
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

          echo "Waiting for the app to become healthy..."
          for i in {1..15}; do
            if curl -fs http://localhost:80/health > /dev/null; then
              echo "Container responded successfully."
              exit 0
            fi
            sleep 3
          done

          echo "===== Smoke test failed — diagnostics below ====="
          echo "--- docker ps -a ---"
          docker ps -a
          echo "--- curl verbose ---"
          curl -v http://localhost:80/health || true
          echo "--- container logs ---"
          docker logs smoke-test
          exit 1
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}

      - name: Clean up smoke-test container
        if: always()
        run: |
          docker stop smoke-test || true
          docker rm smoke-test || true

      - name: Push image to ECR
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

  # --------------------------------------------------------------------
  # 3. Deploy via AWS CodeDeploy — bundle appspec + scripts, upload to
  #    S3, trigger a deployment. CodeDeploy's agent (already running on
  #    EC2) pulls the ECR image itself via deploy/scripts/start_docker.sh.
  # --------------------------------------------------------------------
  deploy:
    name: Deploy via CodeDeploy
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Only the CodeDeploy lifecycle files are needed on the instance —
      # not the whole repo. validate.sh is included since appspec.yml's
      # ValidateService hook depends on it.
      - name: Zip deployment bundle
        run: |
          zip -r deployment.zip \
            appspec.yml \
            deploy/scripts/install_dependencies.sh \
            deploy/scripts/start_docker.sh \
            deploy/scripts/validate.sh

      - name: Upload bundle to S3
        run: |
          aws s3 cp deployment.zip s3://${{ secrets.CODEDEPLOY_S3_BUCKET }}/deployment-${{ github.sha }}.zip

      - name: Trigger CodeDeploy deployment
        id: create-deployment
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name ${{ secrets.CODEDEPLOY_APP_NAME }} \
            --deployment-group-name ${{ secrets.CODEDEPLOY_DEPLOYMENT_GROUP }} \
            --deployment-config-name CodeDeployDefault.OneAtATime \
            --s3-location bucket=${{ secrets.CODEDEPLOY_S3_BUCKET }},key=deployment-${{ github.sha }}.zip,bundleType=zip \
            --file-exists-behavior OVERWRITE \
            --query 'deploymentId' --output text)

          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "Deployment triggered: $DEPLOYMENT_ID"

      - name: Wait for deployment to finish
        run: |
          aws deploy wait deployment-successful \
            --deployment-id ${{ steps.create-deployment.outputs.deployment_id }}
