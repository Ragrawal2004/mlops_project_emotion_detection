name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  project-testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Flake8
        run: flake8 src tests flask_app scripts

      - name: Check Code Formatting
        run: black --check .

      - name: Check Import Order
        run: isort --check-only .

      - name: Run Pylint
        run: pylint src flask_app

      - name: Run DVC Pipeline
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: |
          dvc repro

      - name: Upload Model Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            models/model.pkl
            models/vectorizer.pkl

      - name: Run Unit Tests
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: |
          python -m unittest discover -s tests -v

  docker-build:
    needs: project-testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Model Artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: models

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/mlops-mini-project:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/mlops-mini-project:${{ github.sha }} \
            .

      - name: Run Docker Container
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: |
          docker run -d \
            --name mlops-container \
            -p 5001:5001 \
            -e DAGSHUB_PAT=${{ secrets.DAGSHUB_PAT }} \
            ${{ secrets.DOCKER_USERNAME }}/mlops-mini-project:${{ github.sha }}

      - name: Smoke Test
        run: |
          for i in {1..15}; do
            if curl -f http://localhost:5001/ > /dev/null; then
              echo "Application started successfully."
              exit 0
            fi
            sleep 3
          done

          docker logs mlops-container
          exit 1

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/mlops-mini-project:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/mlops-mini-project:${{ github.sha }}

      - name: Stop Docker Container
        if: always()
        run: docker stop mlops-container

      - name: Remove Docker Container
        if: always()
        run: docker rm mlops-container