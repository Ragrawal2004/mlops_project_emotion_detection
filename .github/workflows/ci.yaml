name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel any in-progress run for the same branch/PR when a new commit lands,
# so you're not burning CI minutes on stale runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; individual jobs can widen this if they need to.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.10"
  DOCKER_IMAGE: rounak810/mlops-mini-project

jobs:
  # --------------------------------------------------------------------
  # 1. Lint, run the DVC pipeline, and test
  # --------------------------------------------------------------------
  project-testing:
    name: Test & Train
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Lint (flake8)
        run: flake8 src tests flask_app scripts

      - name: Run DVC pipeline
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: dvc repro

      - name: Upload trained model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            models/model.pkl
            models/vectorizer.pkl
          retention-days: 1
          if-no-files-found: error

      - name: Run model tests
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: python -m unittest tests/test_model.py -v

      - name: Promote model to Production
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: python scripts/promote_model.py

      - name: Run Flask app tests
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: python -m unittest tests/test_flask_app.py -v

  # --------------------------------------------------------------------
  # 2. Build, smoke-test, and push the Docker image
  # --------------------------------------------------------------------
  docker-build:
    name: Build & Push Image
    needs: project-testing
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download trained model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: models

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run -d --name smoke-test \
            -p 5001:5001 \
            -e DAGSHUB_PAT="${DAGSHUB_PAT}" \
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

          echo "Waiting for the app to become healthy..."
          for i in {1..15}; do
            if curl -fs http://localhost:5001/ > /dev/null; then
              echo "Container responded successfully."
              exit 0
            fi
            sleep 3
          done

          echo "Smoke test failed — container did not become healthy."
          docker logs smoke-test
          exit 1
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}

      - name: Clean up smoke-test container
        if: always()
        run: |
          docker stop smoke-test || true
          docker rm smoke-test || true

      - name: Push image to Docker Hub
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.DOCKER_IMAGE }}:latest
          docker push ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

  # --------------------------------------------------------------------
  # 3. Deploy the pushed image to EC2
  # --------------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            echo "Logging in to Docker Hub..."
            echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            echo "Pulling latest image..."
            docker pull ${{ env.DOCKER_IMAGE }}:latest

            echo "Stopping old container (if any)..."
            docker stop sentiment-app || true
            docker rm sentiment-app || true

            echo "Starting new container..."
            docker run -d \
              --name sentiment-app \
              -p 5001:5001 \
              -e DAGSHUB_PAT="${{ secrets.DAGSHUB_PAT }}" \
              --restart unless-stopped \
              ${{ env.DOCKER_IMAGE }}:latest

            echo "Waiting for the app to become healthy..."
            for i in {1..15}; do
              if curl -fs http://localhost:5001/ > /dev/null; then
                echo "Deployment successful."
                exit 0
              fi
              sleep 3
            done

            echo "Deployment health check failed!"
            docker logs sentiment-app
            exit 1