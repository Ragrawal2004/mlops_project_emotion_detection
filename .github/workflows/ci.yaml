name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.10"
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: rounak_mlflow

jobs:
  # --------------------------------------------------------------------
  # 1. Lint, run the DVC pipeline, and test
  # --------------------------------------------------------------------
  project-testing:
    name: Test & Train
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Lint (flake8)
        run: flake8 src tests flask_app scripts

      - name: Run DVC pipeline
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: dvc repro

      - name: Upload trained model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            models/model.pkl
            models/vectorizer.pkl
          retention-days: 1
          if-no-files-found: error

      - name: Run model tests
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: python -m unittest tests/test_model.py -v

      - name: Promote model to Production
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: python scripts/promote_model.py

      - name: Run Flask app tests
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
        run: python -m unittest tests/test_flask_app.py -v

  # --------------------------------------------------------------------
  # 2. Build, smoke-test, and push the Docker image to ECR
  # --------------------------------------------------------------------
  docker-build:
    name: Build & Push to ECR
    needs: project-testing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_uri: ${{ steps.image-tag.outputs.uri }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download trained model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: models

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: image-tag
        run: |
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          echo "uri=${REGISTRY}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # Building explicitly for linux/amd64 — this is required because
      # local dev builds on Apple Silicon (arm64) produce images that
      # crash on amd64 EC2 instances with "exec format error".
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run -d --name smoke-test \
            -p 80:80 \
            -e DAGSHUB_PAT="${DAGSHUB_PAT}" \
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

          echo "Waiting for the app to become healthy..."
          for i in {1..15}; do
            if curl -fs http://localhost:80/health > /dev/null; then
              echo "Container responded successfully."
              exit 0
            fi
            sleep 3
          done

          echo "Smoke test failed — container did not become healthy."
          docker logs smoke-test
          exit 1
        env:
          DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}

      - name: Clean up smoke-test container
        if: always()
        run: |
          docker stop smoke-test || true
          docker rm smoke-test || true

      - name: Push image to ECR
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

  # --------------------------------------------------------------------
  # 3. Deploy the pushed image to EC2
  # --------------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            AWS_REGION="ap-south-1"
            ECR_REPOSITORY="rounak_mlflow"
            ECR_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"

            echo "Logging in to ECR..."
            aws ecr get-login-password --region "${AWS_REGION}" | \
              docker login --username AWS --password-stdin "${ECR_REGISTRY}"

            echo "Freeing disk space (old images/containers)..."
            docker system prune -af --volumes || true

            echo "Pulling latest image..."
            docker pull "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

            echo "Stopping old container (if any)..."
            docker stop sentiment-app || true
            docker rm sentiment-app || true

            echo "Starting new container..."
            docker run -d \
              --name sentiment-app \
              -p 80:80 \
              -e DAGSHUB_PAT="${{ secrets.DAGSHUB_PAT }}" \
              --restart unless-stopped \
              "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

            echo "Waiting for the app to become healthy..."
            for i in {1..15}; do
              if curl -fs http://localhost:80/health > /dev/null; then
                echo "Deployment successful."
                exit 0
              fi
              sleep 3
            done

            echo "Deployment health check failed!"
            docker logs sentiment-app
            exit 1